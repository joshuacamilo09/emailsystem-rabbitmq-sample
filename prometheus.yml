global:
  scrape_interval: 15s

scrape_configs:
  # The NestJS API, running on the host (npm run start:dev)
  - job_name: 'email-service'
    metrics_path: /api/metrics
    static_configs:
      - targets: ['host.docker.internal:3000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
